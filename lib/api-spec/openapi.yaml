openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Smith Trucking quote and borrow-pit pricing API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: pits
  - name: quote
  - name: users
  - name: settings
  - name: routing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
  /pits:
    get:
      operationId: listPits
      tags: [pits]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pit" }
    post:
      operationId: createPit
      tags: [pits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertPitInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pit" }
  /pits/{id}:
    get:
      operationId: getPit
      tags: [pits]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pit" }
        "404":
          description: Not Found
    patch:
      operationId: updatePit
      tags: [pits]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertPitInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pit" }
    delete:
      operationId: deletePit
      tags: [pits]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
  /pits/nearest:
    get:
      operationId: getNearestPit
      tags: [pits]
      parameters:
        - in: query
          name: lat
          required: true
          schema: { type: number }
        - in: query
          name: lng
          required: true
          schema: { type: number }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NearestPit" }
  /drive-time:
    post:
      operationId: getDriveTime
      tags: [routing]
      summary: Speed-limit based drive time via Google Routes API
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DriveTimeInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DriveTimeResult" }
        "502":
          description: Routes API error
  /quote/calculate:
    post:
      operationId: calculateQuote
      tags: [quote]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalculateQuoteInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteResult" }
  /pits/bulk:
    patch:
      operationId: bulkUpdatePitPrices
      tags: [pits]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkUpdatePitsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pit" }
  /settings:
    get:
      operationId: getSettings
      tags: [settings]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
    put:
      operationId: updateSettings
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpsertSettingsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppSettings" }
  /users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
  /quote-log:
    get:
      operationId: listQuoteLog
      tags: [quote]
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string }
          description: "Filter by status: quoted, awarded, lost, pending, withdrawn"
        - in: query
          name: createdBy
          required: false
          schema: { type: string }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/QuoteLogEntry" }
    post:
      operationId: saveQuoteLog
      tags: [quote]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveQuoteLogInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteLogEntry" }
  /quote-log/{id}:
    patch:
      operationId: updateQuoteLog
      tags: [quote]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateQuoteLogInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QuoteLogEntry" }
        "404":
          description: Not Found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]
    User:
      type: string
      enum: [Alex, Justin]
    HourlyRateType:
      type: string
      enum: [mass_grade, regular, hourly_rate]
      description: "mass_grade=$85/hr, regular=$95/hr, hourly_rate=$100/hr"
    MarginType:
      type: string
      enum: [external, interco]
      description: "external=20%, interco=15%"
    MaterialType:
      type: string
      enum: [fill_dirt, topsoil, sand, rock, gravel, mixed]
    Pit:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        lat: { type: number }
        lng: { type: number }
        materialType: { $ref: "#/components/schemas/MaterialType" }
        pricePerLoad: { type: number }
        smithPrice:
          type: number
          nullable: true
          description: "Smith Trucking internal transfer price per load. Lower than retail for STC-owned pits (used when inner dirt toggle is on)."
        notes: { type: string, nullable: true }
        countyTaxRate:
          type: number
          description: "Decimal rate, e.g. 0.065 for 6.5%"
        updatedBy: { $ref: "#/components/schemas/User" }
        updatedAt: { type: string }
      required:
        - id
        - name
        - address
        - city
        - state
        - lat
        - lng
        - materialType
        - pricePerLoad
        - countyTaxRate
        - updatedBy
        - updatedAt
    UpsertPitInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        address: { type: string, minLength: 1 }
        city: { type: string, minLength: 1 }
        state: { type: string, minLength: 2, maxLength: 2 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        materialType: { $ref: "#/components/schemas/MaterialType" }
        pricePerLoad: { type: number, minimum: 0 }
        smithPrice: { type: number, minimum: 0, nullable: true }
        notes: { type: string, nullable: true }
        countyTaxRate: { type: number, minimum: 0, maximum: 0.2 }
        updatedBy: { $ref: "#/components/schemas/User" }
      required:
        - name
        - address
        - city
        - state
        - lat
        - lng
        - materialType
        - pricePerLoad
        - countyTaxRate
        - updatedBy
    NearestPit:
      type: object
      properties:
        pit: { $ref: "#/components/schemas/Pit" }
        distanceMiles: { type: number }
        estimatedOneWayMinutes: { type: number }
      required: [pit, distanceMiles, estimatedOneWayMinutes]
    CalculateQuoteInput:
      type: object
      properties:
        pitId: { type: string }
        destLat: { type: number }
        destLng: { type: number }
        destLabel: { type: string, nullable: true }
        hourlyRateType: { $ref: "#/components/schemas/HourlyRateType" }
        marginType: { $ref: "#/components/schemas/MarginType" }
        loads: { type: integer, minimum: 1 }
        avgSpeedMph:
          type: number
          minimum: 5
          maximum: 80
          description: "Used to estimate one-way drive time from straight-line distance when driveTimeMinutes is not provided"
        loadBufferMinutes:
          type: number
          minimum: 0
          description: "Extra minutes added per round trip for loading. Default 15."
        driveTimeMinutes:
          type: number
          minimum: 0
          nullable: true
          description: "One-way drive time in minutes from Google Maps Distance Matrix. When provided, supersedes haversine+speed estimate. Units: minutes (not seconds)."
        driveDistanceMiles:
          type: number
          minimum: 0
          nullable: true
          description: "One-way drive distance in miles from Google Maps Distance Matrix. Used for display only — does not affect pricing."
        overridePricePerLoad:
          type: number
          minimum: 0
          nullable: true
          description: "Override material cost per load (e.g. inner dirt at $85/load). When null or omitted, uses the pit's configured pricePerLoad."
      required:
        - pitId
        - destLat
        - destLng
        - hourlyRateType
        - marginType
        - loads
    BulkUpdatePitsInput:
      type: object
      properties:
        updatedBy: { $ref: "#/components/schemas/User" }
        updates:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id: { type: string }
              pricePerLoad: { type: number, minimum: 0 }
              countyTaxRate: { type: number, minimum: 0, maximum: 0.2 }
            required: [id, pricePerLoad, countyTaxRate]
      required: [updatedBy, updates]
    AppSettings:
      type: object
      properties:
        massGradeRate: { type: number, minimum: 0 }
        regularRate: { type: number, minimum: 0 }
        hourlyRate: { type: number, minimum: 0 }
        externalMargin: { type: number, minimum: 0, maximum: 1 }
        intercoMargin: { type: number, minimum: 0, maximum: 1 }
        avgSpeedMph: { type: number, minimum: 5, maximum: 80 }
        loadBufferMinutes: { type: number, minimum: 0 }
        updatedBy: { $ref: "#/components/schemas/User" }
        updatedAt: { type: string }
      required:
        - massGradeRate
        - regularRate
        - hourlyRate
        - externalMargin
        - intercoMargin
        - avgSpeedMph
        - loadBufferMinutes
        - updatedBy
        - updatedAt
    UpsertSettingsInput:
      type: object
      properties:
        massGradeRate: { type: number, minimum: 0 }
        regularRate: { type: number, minimum: 0 }
        hourlyRate: { type: number, minimum: 0 }
        externalMargin: { type: number, minimum: 0, maximum: 1 }
        intercoMargin: { type: number, minimum: 0, maximum: 1 }
        avgSpeedMph: { type: number, minimum: 5, maximum: 80 }
        loadBufferMinutes: { type: number, minimum: 0 }
        updatedBy: { $ref: "#/components/schemas/User" }
      required:
        - massGradeRate
        - regularRate
        - hourlyRate
        - externalMargin
        - intercoMargin
        - avgSpeedMph
        - loadBufferMinutes
        - updatedBy
    DriveTimeInput:
      type: object
      properties:
        originLat: { type: number }
        originLng: { type: number }
        destLat: { type: number }
        destLng: { type: number }
      required: [originLat, originLng, destLat, destLng]
    DriveTimeResult:
      type: object
      properties:
        driveTimeMinutes: { type: number }
        driveDistanceMiles: { type: number }
        source:
          type: string
          enum: [routes_api, haversine_fallback]
      required: [driveTimeMinutes, driveDistanceMiles, source]
    QuoteResult:
      type: object
      properties:
        pit: { $ref: "#/components/schemas/Pit" }
        distanceMiles: { type: number }
        oneWayMinutes: { type: number }
        roundTripMinutes: { type: number }
        loadBufferMinutes: { type: number }
        totalMinutesPerLoad: { type: number }
        hourlyRate: { type: number }
        marginPercent: { type: number }
        countyTaxRate: { type: number }
        truckingPerLoad: { type: number }
        truckingWithMarginPerLoad: { type: number }
        materialPerLoad: { type: number }
        subtotalPerLoad: { type: number }
        taxPerLoad: { type: number }
        totalPerLoad: { type: number }
        loads: { type: integer }
        grandTotal: { type: number }
        distanceSource:
          type: string
          enum: [routes_api, haversine]
          description: "Which source produced the drive-time used in this quote"
        priceWasOverridden: { type: boolean }
        marketPricePerLoad: { type: number }
        loadsPerTruckPerDay:
          type: number
          description: "Number of loads one truck can complete in a 9.5-hour day"
      required:
        - pit
        - distanceMiles
        - oneWayMinutes
        - roundTripMinutes
        - loadBufferMinutes
        - totalMinutesPerLoad
        - hourlyRate
        - marginPercent
        - countyTaxRate
        - truckingPerLoad
        - truckingWithMarginPerLoad
        - materialPerLoad
        - subtotalPerLoad
        - taxPerLoad
        - totalPerLoad
        - loads
        - grandTotal
        - distanceSource
        - priceWasOverridden
        - marketPricePerLoad
        - loadsPerTruckPerDay
    QuoteStatus:
      type: string
      enum: [quoted, awarded, lost, pending, withdrawn]
    QuoteLogEntry:
      type: object
      properties:
        id: { type: string }
        jobName: { type: string }
        jobAddress: { type: string, nullable: true }
        destLat: { type: number }
        destLng: { type: number }
        companyName: { type: string, nullable: true }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        isIntercompany: { type: string, enum: [Y, N] }
        pitId: { type: string }
        pitNameSnapshot: { type: string }
        loads: { type: integer }
        totalLoadQuantity:
          type: integer
          nullable: true
          description: "Total load quantity on the quote (may differ from loads used in pricing)"
        hourlyRateType: { $ref: "#/components/schemas/HourlyRateType" }
        marginType: { $ref: "#/components/schemas/MarginType" }
        pricePerLoad: { type: number }
        grandTotal: { type: number }
        status: { $ref: "#/components/schemas/QuoteStatus" }
        notes: { type: string, nullable: true }
        createdBy: { $ref: "#/components/schemas/User" }
        createdAt: { type: string }
        updatedAt: { type: string }
      required:
        - id
        - jobName
        - destLat
        - destLng
        - isIntercompany
        - pitId
        - pitNameSnapshot
        - loads
        - hourlyRateType
        - marginType
        - pricePerLoad
        - grandTotal
        - status
        - createdBy
        - createdAt
        - updatedAt
    SaveQuoteLogInput:
      type: object
      properties:
        jobName: { type: string, minLength: 1 }
        jobAddress: { type: string, nullable: true }
        destLat: { type: number }
        destLng: { type: number }
        companyName: { type: string, nullable: true }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        isIntercompany: { type: string, enum: [Y, N] }
        pitId: { type: string }
        pitNameSnapshot: { type: string }
        loads: { type: integer, minimum: 1 }
        totalLoadQuantity:
          type: integer
          minimum: 1
          nullable: true
          description: "Total load quantity on the quote (may differ from loads used in pricing)"
        hourlyRateType: { $ref: "#/components/schemas/HourlyRateType" }
        marginType: { $ref: "#/components/schemas/MarginType" }
        pricePerLoad: { type: number, minimum: 0 }
        grandTotal: { type: number, minimum: 0 }
        notes: { type: string, nullable: true }
        createdBy: { $ref: "#/components/schemas/User" }
      required:
        - jobName
        - destLat
        - destLng
        - isIntercompany
        - pitId
        - pitNameSnapshot
        - loads
        - hourlyRateType
        - marginType
        - pricePerLoad
        - grandTotal
        - createdBy
    UpdateQuoteLogInput:
      type: object
      properties:
        status: { $ref: "#/components/schemas/QuoteStatus" }
        notes: { type: string, nullable: true }
        jobName: { type: string, minLength: 1 }
        companyName: { type: string, nullable: true }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
